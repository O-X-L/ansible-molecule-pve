[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "molecule-pve"
authors = [
    {name = "Pascal Rath", email = "rath+moleculepve@oxl.at"},
]
description = "Ansible Collection of Util-Modules for the Ansible-Molecule Proxmox-VE Driver"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["ansible", "ansible-molecule", "ansible-molecule-driver", "ansible-testing"]
license = {file = "LICENSE"}
classifiers = [
    'Programming Language :: Python :: 3',
    'License :: OSI Approved :: MIT License',
    'Framework :: Ansible',
]
dynamic = ["dependencies", "version"]

[project.urls]
Homepage = "https://github.com/O-X-L/ansible-molecule-pve"
Documentation = "https://ansible-molecule-pve.oxl.app"
Repository = "https://github.com/O-X-L/ansible-molecule-pve.git"
Issues = "https://github.com/O-X-L/ansible-molecule-pve/issues"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
version = {file = ["VERSION"]}

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["*_pytest.py"]

[tool.setuptools.package-data]
"*" = ["*.yml", "*.json", "*.rst"]

[project.entry-points."molecule.driver"]
proxmox = "molecule_pve.driver:Proxmox"
