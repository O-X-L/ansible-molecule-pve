---

- name: Destroy
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    options: "{{ molecule_yml.driver.options }}"

  tasks:
    - name: Load proxmox connection secrets
      ansible.builtin.include_tasks: common/secrets.yml
      when: options.proxmox_secrets is defined

    - name: Validating options
      ansible.builtin.include_tasks: common/validate_options.yml

    - name: Check for molecule-cache
      ansible.builtin.stat:
        path: "{{ molecule_instance_config }}"
      register: cache_file

    - name: Load molecule-cache
      ansible.builtin.set_fact:
        cache_instances: "{{ lookup('file', molecule_instance_config) | from_yaml }}"
      when: cache_file.stat.exists

    - name: Remove molecule instance(s) (async)
      community.proxmox.proxmox_kvm:
        api_host: "{{ api_host | d(options.api_host) | d(omit) }}"
        api_port: "{{ api_port | d(options.api_port) | d(omit) }}"
        api_user: "{{ api_user | d(options.api_user) | d(omit) }}"
        api_password: "{{ api_password | d(options.api_password) | d(omit) }}"
        api_token_id: "{{ api_token_id | d(options.api_token_id) | d(omit) }}"
        api_token_secret: "{{ api_token_secret | d(options.api_token_secret) | d(omit) }}"
        state: absent
        vmid: "{{ i.vmid }}"
        node: "{{ options.node }}"
        force: true
        timeout: "{{ options.timeout | d(120) }}"
        validate_certs: "{{ options.validate_certs | d(omit) }}"
        ca_path: "{{ options.ca_path | d(omit) }}"
      loop: "{{ cache_instances }}"
      loop_control:
        loop_var: i
        label: "{{ i.instance }}, {{ i.vmid }}"
      async: "{{ options.timeout | d(120) }}"
      poll: 0
      register: proxmox_vm_destroy
      when: cache_file.stat.exists

    - name: DEBUG | Display VM-shutdown & -destroy output
      ansible.builtin.debug:
        var: proxmox_vm_destroy
      when:
        - options.debug | d(false) | bool
        - cache_file.stat.exists

    - name: Wait for all VMs to be shutdown and destroyed
      ansible.builtin.async_status:
        jid: "{{ vm_destroy.ansible_job_id }}"
      register: proxmox_vm_destroy_result
      until: proxmox_vm_destroy_result.finished == 1
      retries: "{{ options.timeout | d(120) }}"
      delay: 2
      loop: "{{ proxmox_vm_destroy.results }}"
      loop_control:
        loop_var: vm_destroy
        label: "{{ vm_destroy.i.instance }}"
      when: cache_file.stat.exists

    - name: DEBUG | Display VM-shutdown & -destroy result
      ansible.builtin.debug:
        var: proxmox_vm_shutdown_destroy_result
      when:
        - options.debug | d(false) | bool
        - cache_file.stat.exists

    - name: Remove instances from molecule-cache
      ansible.builtin.file:
        path: "{{ molecule_instance_config }}"
        state: absent
